# Binary releases — the artifact Contiki-NG CI downloads instead of compiling us.
#
# Pushing a tag `v*` builds a per-platform tarball of test_runner + the three
# runner scripts, smoke-tests THE UNPACKED TARBALL (not the build tree), and
# attaches everything plus SHA256SUMS to a GitHub release.  Running the
# workflow by hand (Actions -> release -> Run workflow, or
# `gh workflow run release.yml --ref main`) is a dry run: the same builds and
# tests, the tarballs as workflow artifacts, the release notes it would use in
# the job summary — and nothing published.
#
# Design decisions, from docs/design/contiki-ng-testing-plan.md Phase 0:
#
#  - GNU Lightning is built from source with --disable-shared and linked
#    STATICALLY.  A dylib/so dependency would make the binary unusable outside
#    the build machine, and Homebrew's liblightning.a is not linkable on macOS
#    (GNU ar format).  Shipping the JIT costs nothing in reproducibility: it
#    is cycle-exact by gate, so a Lightning-enabled binary and an
#    interpreter-only one produce byte-identical simulation output.
#    An assert step fails the release if a dynamic lightning dep sneaks in.
#
#  - NATIVE_FLAG= overrides the default -march=native/-mcpu=native: a release
#    binary must run on CPUs other than the runner's.  linux-x86_64 builds on
#    ubuntu-22.04 deliberately — the oldest supported runner image, so the
#    glibc baseline (2.35) stays low enough for the containers contiki-ng CI
#    uses.  Remaining dynamic deps are libc/libm/libpthread only (QuickJS and
#    cJSON are vendored; dlopen is used only by the optional plugin system,
#    which the Cooja suite never touches).
#
#  - The tarball keeps the repo layout (build/test_runner, tools/*.sh) because
#    the scripts are the interface: run-cooja-tests.sh locates the runner via
#    its own path, so the unpacked tree works with zero configuration beyond
#    CONTIKI_DIR.  Firmware compilation deliberately stays on the contiki-ng
#    side — that is their code under test.
#
# And from what the first releases taught:
#
#  - A tag publishes only what main has already proven (vX.Y.Z; vX.Y.Z-rcN
#    is the same path published as a prerelease, for rehearsing a release).  `verify` refuses a
#    tag that is not on main, whose `tests` run did not succeed, whose number
#    differs from CSIM_VERSION, or that has no CHANGELOG.md section of its
#    own — before three platforms spend half an hour building it.
#
#  - The unpacked binary runs real firmware, not only instruction suites:
#    a generic-arch build that silently cannot boot ARM firmware (the
#    -march=native miscompile on Apple Silicon) passes every instruction-level
#    test.  Three networks — MSP430 + Cortex-M3 + M4F on one DAG, TrustZone-M
#    RPL-UDP, nRF52840 TSCH — each with the JIT on and off, which must agree
#    byte for byte (the 64-bit divide trap divergence, PR #69, only showed on
#    TSCH).  The three platforms' outputs are compared with each other too.
#
#  - The release is created as a draft, checked to carry every asset, and only
#    then published, so a failed upload never leaves a public release with
#    half its tarballs.  The notes are the version's CHANGELOG.md section with
#    GitHub's PR list after it, and every tarball gets a build-provenance
#    attestation (`gh attestation verify FILE -R mikroverk/cooja-ng`).
#
#  - Least privilege: only the job that publishes can write, and every action
#    is pinned to a commit (the comment names the release it is).
name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    permissions:
      contents: read
      actions: read
    outputs:
      version: ${{ steps.version.outputs.version }}
      pkg_version: ${{ steps.version.outputs.pkg_version }}
      publish: ${{ steps.version.outputs.publish }}
      prerelease: ${{ steps.version.outputs.prerelease }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          fetch-depth: 0

      - name: Version, tag and changelog agree
        id: version
        run: |
          version=$(sed -n 's/^#define CSIM_VERSION "\(.*\)"$/\1/p' include/sim/csim_version.h)
          [ -n "$version" ] || { echo "::error::no CSIM_VERSION in include/sim/csim_version.h"; exit 1; }
          prerelease=false
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            # vX.Y.Z is the release; vX.Y.Z-rcN is a release candidate of it,
            # published as a prerelease (never "Latest") so the whole tag
            # path can be rehearsed. Both need CSIM_VERSION = X.Y.Z.
            case "${GITHUB_REF_NAME#v}" in
              "$version") ;;
              "$version"-rc[1-9]|"$version"-rc[1-9][0-9]) prerelease=true ;;
              *) echo "::error::tag $GITHUB_REF_NAME, but CSIM_VERSION is $version: tag v$version or v$version-rcN, after bumping include/sim/csim_version.h"
                 exit 1 ;;
            esac
            section=$version publish=true pkg=$GITHUB_REF_NAME
          else
            section=Unreleased publish=false pkg="v${version}-dryrun-${GITHUB_SHA::8}"
          fi
          # The section runs from its "## [x.y.z]" heading to the next "## [".
          awk -v h="## [$section]" 'index($0, h) == 1 { f = 1; next } f && /^## \[/ { exit } f' \
            CHANGELOG.md > release-notes.md
          if ! grep -q '[^[:space:]]' release-notes.md; then
            if [ "$publish" = true ]; then
              echo "::error::CHANGELOG.md has no '## [$version]' section: move the Unreleased entries under it before tagging"
              exit 1
            fi
            echo "::warning::CHANGELOG.md has no Unreleased entries"
          fi
          {
            echo "version=$version"
            echo "pkg_version=$pkg"
            echo "publish=$publish"
            echo "prerelease=$prerelease"
          } >> "$GITHUB_OUTPUT"
          {
            if [ "$prerelease" = true ]; then echo "## Release candidate $GITHUB_REF_NAME (a prerelease)"
            elif [ "$publish" = true ]; then echo "## Releasing $GITHUB_REF_NAME"
            else echo "## Dry run: $pkg (nothing is published)"; echo
                 echo "A tag would publish CHANGELOG.md's \`## [$version]\` section; the Unreleased section below is what it holds now."
            fi
            echo; echo "### Release notes (from CHANGELOG.md \`[$section]\`)"; echo
            cat release-notes.md
          } >> "$GITHUB_STEP_SUMMARY"

      - name: The tagged commit is on main
        if: steps.version.outputs.publish == 'true'
        run: |
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::$GITHUB_REF_NAME ($GITHUB_SHA) is not on main: release only what has been merged"
            exit 1
          fi

      - name: The tagged commit passed the tests workflow
        if: steps.version.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Tagging right after a merge is fine: wait for the run to finish.
          for _ in $(seq 1 120); do
            runs=$(gh run list -R "$GITHUB_REPOSITORY" --workflow test.yml --commit "$GITHUB_SHA" \
                     --json status,conclusion --jq '.[] | .status + "/" + .conclusion')
            if echo "$runs" | grep -qx 'completed/success'; then
              echo "tests passed on $GITHUB_SHA"; exit 0
            fi
            if ! echo "$runs" | grep -qv '^completed/'; then break; fi   # none still running
            sleep 30
          done
          echo "::error::no successful 'tests' run for $GITHUB_SHA (runs: ${runs:-none}). Tag a commit whose tests passed, or re-run them and then this workflow."
          exit 1

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: release-notes
          path: release-notes.md
          if-no-files-found: error

  build:
    name: ${{ matrix.target }}
    needs: verify
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-22.04, target: linux-x86_64 }
          - { os: macos-15-intel, target: macos-x64 }   # GitHub's current Intel runner — same one Contiki-NG CI uses; macos-13 is retired and queues forever
          - { os: macos-latest, target: macos-arm64 }
    env:
      VERSION: ${{ needs.verify.outputs.version }}
      PKG: cooja-ng-${{ needs.verify.outputs.pkg_version }}-${{ matrix.target }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0

      # The vendored patch is upstream lightning commit bfd695a9 ("Correct
      # wrong ifdef causing missing mprotect call") — without it, jit_emit
      # never mprotects the code page to PROT_READ|PROT_EXEC and every
      # generated block SIGBUSes on Apple Silicon (Linux only survives by
      # accident of its mmap defaults).  Homebrew ships the same patch; the
      # vanilla 2.2.3 tarball does not.  Vendored so a release cannot depend
      # on savannah's cgit being up.
      - name: Build static GNU Lightning 2.2.3 (+ mprotect fix)
        run: |
          .github/scripts/fetch-lightning.sh
          cd lightning-2.2.3
          ./configure --prefix="$GITHUB_WORKSPACE/.lightning" --disable-shared > /dev/null
          make -j"$(getconf _NPROCESSORS_ONLN)" > /dev/null
          make install > /dev/null

      - name: Build test_runner (generic arch, static Lightning)
        run: |
          make -j"$(getconf _NPROCESSORS_ONLN)" \
            NATIVE_FLAG= \
            LIGHTNING_CFLAGS="-I$GITHUB_WORKSPACE/.lightning/include" \
            LIGHTNING_LIBS="$GITHUB_WORKSPACE/.lightning/lib/liblightning.a"

      - name: Assert no dynamic Lightning dependency
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then deps=$(ldd build/test_runner); else deps=$(otool -L build/test_runner); fi
          echo "$deps"
          if echo "$deps" | grep -qi lightning; then
            echo "::error::release binary dynamically links GNU Lightning — not portable"
            exit 1
          fi

      - name: Package
        run: |
          mkdir -p "dist/$PKG/build" "dist/$PKG/tools"
          cp build/test_runner                "dist/$PKG/build/"
          cp tools/run-cooja-tests.sh         "dist/$PKG/tools/"
          cp tools/csc2json.py                "dist/$PKG/tools/"
          cp tools/build-test-firmware.sh     "dist/$PKG/tools/"
          # csc2json.py rewrites the Cooja serial-socket host command to this
          # wrapper; without it 6 of the 8 17-tun-rpl-br tests fail at host
          # start (/bin/sh: test-border-router.sh: not found).
          cp tools/test-border-router.sh      "dist/$PKG/tools/"
          cat > "dist/$PKG/README.md" <<EOF
          # Cooja-NG ${VERSION} (${{ matrix.target }})

          Standalone Cooja-compatible simulator binary + Contiki-NG test-suite
          runner. No build step, no JVM. GNU Lightning JIT statically linked
          (cycle-exact: results are byte-identical with the JIT on or off).

          Run the Contiki-NG Cooja simulation suite:

              CONTIKI_DIR=/path/to/contiki-ng tools/run-cooja-tests.sh
              CONTIKI_DIR=/path/to/contiki-ng tools/run-cooja-tests.sh --with-tun   # + border-router tests (needs sudo/TUN)
              CONTIKI_DIR=/path/to/contiki-ng tools/run-cooja-tests.sh 07-simulation-base/01-cooja-hello-world \
                  --seed 3 --logdir /path/to/contiki-ng/tests     # one test, one seed, .testlog beside the .csc

          --seed N is Cooja's --random-seed (same seed = byte-identical run);
          --logdir DIR writes DIR/<category>/<csc-name>.testlog per test. The suite fails
          loudly: an unknown .csc feature, a failed firmware build, a test with
          no assertions or a script without a verdict fails the run - never a
          silent skip. To run it from inside a Contiki-NG tree
          (make -C tests/<category> SIMULATOR=cooja-ng) and from CI, see
          https://github.com/mikroverk/cooja-ng/blob/main/docs/contiki-ng-testing.md

          Firmware is compiled from the Contiki-NG tree by the runner
          (tools/build-test-firmware.sh); this package contains no firmware.

          Own simulations: build/test_runner test my-sim.yaml (YAML or JSON;
          --save-config out.yaml writes the live setup back). Schema:
          https://github.com/mikroverk/cooja-ng/blob/main/docs/test-format.md

          Requires: python3 (csc conversion), a Contiki-NG checkout, and the
          usual embedded toolchains for the firmware builds.

          Self-check without a Contiki-NG tree:

              build/test_runner correctness && build/test_runner arm-correctness

          Provenance: gh attestation verify $PKG.tar.gz -R mikroverk/cooja-ng
          EOF
          tar -C dist -czf "dist/$PKG.tar.gz" "$PKG"

      - name: Smoke-test the unpacked tarball
        run: |
          rm -rf /tmp/pkgtest && mkdir -p /tmp/pkgtest && tar -C /tmp/pkgtest -xzf "dist/$PKG.tar.gz"
          cd "/tmp/pkgtest/$PKG"
          # The binary reports exactly the version being released (verify has
          # already checked the tag against CSIM_VERSION).
          got=$(./build/test_runner --version)
          [ "$got" = "Cooja-NG (csim) $VERSION" ] || { echo "::error::binary reports '$got', expected $VERSION"; exit 1; }
          ./build/test_runner correctness | grep "RESULT: PASS"
          ./build/test_runner arm-correctness | grep -E "Results: [0-9]+ passed, 0 failed"
          ./build/test_runner arm-decode | grep -E "Results: [0-9]+ passed, 0 failed"
          # arm-jit exercises the statically linked JIT's GENERATED CODE on
          # this host; a SKIP here means Lightning fell out of the build.
          ./build/test_runner arm-jit | tee jit.out | grep -E "Results: [0-9]+ passed, 0 failed"
          if grep -q SKIP jit.out; then echo "::error::arm-jit skipped in release binary"; exit 1; fi

      # The tarball ships no firmware, so run the unpacked binary from the
      # checkout, where configs/ and firmware/ are.
      - name: Real firmware on the unpacked binary (JIT on and off agree)
        run: |
          bin="/tmp/pkgtest/$PKG/build/test_runner"
          filter='Wall-clock|Speed ratio|Throughput|MIPS'
          mkdir -p simout
          for cfg in configs/test-mixed-platform-rpl.yaml \
                     configs/test-tz-rpl-udp-nrf54l15-xiao.yaml \
                     configs/test-tsch-nrf52840-dk.json; do
            name=$(basename "${cfg%.*}")
            for jit in 1 0; do
              if ! CSIM_ARM_JIT=$jit "$bin" test "$cfg" -v --wall-timeout 900 > "simout/$name.jit$jit.raw" 2>&1; then
                echo "::error::$cfg failed with the release binary (CSIM_ARM_JIT=$jit)"
                tail -40 "simout/$name.jit$jit.raw"
                exit 1
              fi
              grep -vE "$filter" "simout/$name.jit$jit.raw" > "simout/$name.jit$jit.out"
            done
            grep -q "TEST PASSED" "simout/$name.jit1.out"
            if ! cmp -s "simout/$name.jit1.out" "simout/$name.jit0.out"; then
              echo "::error::$cfg: the JIT changes the simulation in the release binary"
              diff "simout/$name.jit0.out" "simout/$name.jit1.out" | head -20
              exit 1
            fi
            echo "$cfg: passed, JIT on = JIT off ($(wc -l < "simout/$name.jit1.out") lines)"
          done
          rm -f simout/*.raw simout/*.jit0.out

      - name: Summary
        run: |
          sum=$(if command -v sha256sum > /dev/null; then sha256sum "dist/$PKG.tar.gz"; else shasum -a 256 "dist/$PKG.tar.gz"; fi)
          echo "- \`$PKG.tar.gz\`: $(wc -c < "dist/$PKG.tar.gz" | tr -d ' ') bytes, sha256 \`${sum%% *}\`" >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: tarball-${{ matrix.target }}
          path: dist/*.tar.gz
          if-no-files-found: error

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: simout-${{ matrix.target }}
          path: simout/
          if-no-files-found: error

  # The same seed gives the same run on every platform we ship.
  compare:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4.3.0
        with:
          pattern: simout-*
          path: simout
      - name: Simulation output identical across platforms
        run: |
          cd simout
          ref=simout-linux-x86_64
          status=0
          for other in simout-macos-x64 simout-macos-arm64; do
            for f in "$ref"/*.out; do
              g="$other/$(basename "$f")"
              if cmp -s "$f" "$g"; then
                echo "same: $(basename "$f") linux-x86_64 = ${other#simout-}"
              else
                echo "::error::$(basename "$f") differs between linux-x86_64 and ${other#simout-}"
                diff "$f" "$g" | head -20
                status=1
              fi
            done
          done
          exit $status

  release:
    needs: [verify, build, compare]
    if: needs.verify.outputs.publish == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write        # create the release
      id-token: write        # sign the provenance attestation
      attestations: write    # store it
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4.3.0
        with:
          pattern: tarball-*
          path: dist
          merge-multiple: true

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4.3.0
        with:
          name: release-notes

      - name: Checksums
        run: cd dist && sha256sum *.tar.gz > SHA256SUMS && cat SHA256SUMS

      - uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be  # v2.4.0
        with:
          subject-path: dist/*.tar.gz

      - name: Create the release as a draft, check it, publish it
        env:
          GH_TOKEN: ${{ github.token }}
          PRERELEASE: ${{ needs.verify.outputs.prerelease }}
        run: |
          repo=$GITHUB_REPOSITORY tag=$GITHUB_REF_NAME
          # A release candidate is a prerelease and never becomes "Latest".
          kind=()
          if [ "$PRERELEASE" = true ]; then kind=(--prerelease --latest=false); fi
          # A draft left by an earlier, failed attempt at this tag is replaced;
          # a published release is never touched.
          if state=$(gh release view "$tag" -R "$repo" --json isDraft --jq .isDraft 2>/dev/null); then
            if [ "$state" = true ]; then
              gh release delete "$tag" -R "$repo" --yes
            else
              echo "::error::release $tag is already published"; exit 1
            fi
          fi
          gh release create "$tag" -R "$repo" --draft --verify-tag "${kind[@]}" \
            --title "Cooja-NG $tag" \
            --notes-file release-notes.md --generate-notes \
            dist/*.tar.gz dist/SHA256SUMS
          want=$(ls dist | wc -l)
          got=$(gh release view "$tag" -R "$repo" --json assets --jq '[.assets[] | select(.state == "uploaded")] | length')
          if [ "$got" != "$want" ]; then
            echo "::error::the draft has $got of $want assets; left as a draft"
            exit 1
          fi
          gh release edit "$tag" -R "$repo" --draft=false
          gh release view "$tag" -R "$repo" --json url --jq .url
