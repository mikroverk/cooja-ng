name: tests

on:
  push:
    branches: [main]
  pull_request:

# Cancel in-flight runs when a new commit lands on the same PR/branch.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The simulator compiled to WebAssembly (wasm/), which the
  # Pages workflow publishes as the site's live demos.  Built here on every PR
  # so that what only emcc's clang warns about (-Werror) or a WASM build that
  # simulates differently from native fails the PR, not the next deploy.  The
  # native reference is built without Lightning (the WASM build has no JIT).
  # That is not what makes parity hold: ARM multi-node runs use the JIT when
  # Lightning is present, and the ARM JIT is cycle-identical with the
  # interpreter (checked below in the test job).
  wasm:
    name: wasm / emscripten
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build (native, the parity reference)
        run: make -j"$(nproc)"
      - name: Build the WebAssembly and check parity with native
        run: |
          .github/scripts/install-emsdk.sh "$RUNNER_TEMP/emsdk"   # shared with pages.yml
          source "$RUNNER_TEMP/emsdk/emsdk_env.sh"
          make -C wasm -j"$(nproc)" web check

  # AddressSanitizer + UndefinedBehaviorSanitizer on the paths where a dead or
  # half-built platform could be reached: malformed firmware, a reboot whose
  # boot fails, live saves, and the config loader's refusals.  Interpreter
  # only (LIGHTNING_LIBS= leaves the JITs out: their generated code is not
  # instrumented), no LTO, and warnings stay warnings (the -O3 jobs hold
  # those).  Any sanitizer report fails the job.
  sanitizers:
    name: sanitizers (ASan + UBSan, interpreter)
    runs-on: ubuntu-latest
    env:
      ASAN_OPTIONS: detect_leaks=0:abort_on_error=1
      UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
    steps:
      - uses: actions/checkout@v4
      - name: Build with -fsanitize=address,undefined
        run: |
          make -j"$(nproc)" LIGHTNING_LIBS= \
            CFLAGS='-O1 -g -fno-omit-frame-pointer -fsanitize=address,undefined -Wall -Wextra -Wno-unused-parameter -std=c11 -ffp-contract=off -D_GNU_SOURCE $(INCLUDES) -MMD -MP' \
            LDFLAGS='-fsanitize=address,undefined -lm -lpthread -rdynamic' \
            build/test_runner build/cngsim
      - name: Malformed firmware
        run: RUNNER=./build/test_runner tools/check-elf-malformed.sh
      - name: A reboot whose boot fails
        run: RUNNER=./build/test_runner tools/check-lifecycle.sh
      - name: Live saves
        run: tools/check-save.sh
      - name: Config loader (refusals, round trip, nesting depth)
        run: |
          ./build/test_runner config-reject test/configs/invalid/*
          ./build/test_runner config-roundtrip configs/*.json configs/*.yaml examples/*.yaml test/configs/*.yaml
          ./build/test_runner config-depth

  test:
    name: ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, label: "ubuntu / gcc" }
          - { os: macos-latest,  label: "macos / clang" }
    steps:
      - uses: actions/checkout@v4

      # GNU Lightning enables the MSP430 and ARM JITs.  It is installed
      # explicitly and ASSERTED below because the build auto-detects it:
      # without it, `make` silently compiles the JITs out and the arm-jit
      # suite self-skips — which is how 410400 generated-code comparisons can
      # "pass" in 40 seconds without executing a single generated instruction.
      # That failure mode is exactly the one this suite exists for: the
      # x86-64-only `jit_andi 0x80000000` miscompile stayed green on every
      # other signal.  Pinned to 2.2.3 — the version both dev machines run,
      # and whose backend bug arm_jit.c (emit_n_bit) works around; a silent
      # version drift here should be a deliberate choice, not runner luck.
      # No usable Ubuntu package exists, so Linux builds it from source.
      - name: Install GNU Lightning (Linux, source build)
        if: runner.os == 'Linux'
        run: |
          .github/scripts/fetch-lightning.sh   # fetch + sha256 + mprotect patch, shared with release.yml
          cd lightning-2.2.3
          ./configure --prefix=/usr/local > /dev/null
          make -j"$(nproc)" > /dev/null
          sudo make install > /dev/null
          sudo ldconfig

      - name: Install GNU Lightning (macOS)
        if: runner.os == 'macOS'
        run: brew install lightning

      - name: Assert Lightning is visible to the build
        run: pkg-config --exists lightning && pkg-config --modversion lightning

      - name: Build
        run: make

      # The simulator linked without test/ — fails if a kernel, chip or
      # service object needs a symbol only the runner defines.  test_runner
      # links everything together, so nothing else would notice.
      - name: Library link check
        run: make lib-link-check

      - name: MSP430 instruction tests
        run: ./build/test_runner correctness

      - name: ARM instruction tests
        run: ./build/test_runner arm-correctness

      # Differential test of the JIT's decoder + reference model against the
      # interpreter: all 65536 Thumb halfwords x 6 random register/flag states.
      # Deterministic and fast (~1s), and it is the only thing that catches
      # flag-only drift between the two implementations — the failure mode
      # that is invisible until a conditional branch goes the wrong way.
      - name: ARM decoder differential tests
        run: ./build/test_runner arm-decode

      # Differential test of the GENERATED CODE against the interpreter, over
      # the same exhaustive encoding sweep.  This is not redundant with
      # arm-decode: that one validates the *description* of an instruction,
      # while the JIT ships a third implementation — the machine code GNU
      # Lightning emits — and only running it tests it, on the host it was
      # emitted for.  It is here because jit_andi(dst, src, 0x80000000) returns
      # 0 on x86-64 Lightning 2.2.3, which made every N-reading condition
      # (MI/PL/GE/LT/GT/LE) silently take the wrong branch on that host while
      # arm-decode, arm-correctness and the whole Cooja suite stayed green.
      # Skips itself cleanly when Lightning is not installed.
      - name: ARM JIT generated-code differential tests
        run: |
          set -o pipefail
          ./build/test_runner arm-jit | tee armjit.out
          if grep -q "SKIP" armjit.out; then
            echo "::error::arm-jit skipped — Lightning missing despite the install step"
            exit 1
          fi

      - name: Timeline unit tests
        run: ./build/test_runner timeline

      - name: MSP430 firmware boot tests
        run: ./build/test_runner firmware

      - name: ARM firmware boot tests
        run: ./build/test_runner arm-firmware

      - name: MSP430 multinode (2 nodes, 5s sim)
        run: ./build/test_runner multinode -n 2 -t 5000 -q

      - name: ARM multinode (CC2538 nullnet, 5s sim)
        run: ./build/test_runner arm-multinode firmware/cc2538dk/nullnet-broadcast.cc2538dk -t 5000 -q

      - name: CC1200 chip-driver mock-host tests
        run: ./build/test_runner cc1200-mock-host

      - name: nRF54L15 SPIM model unit tests
        run: ./build/test_runner nrf54l15-spim

      - name: MX25R6435F flash chip-driver mock-host tests
        run: ./build/test_runner mx25r6435f-mock-host

      - name: ENC28J60 chip-driver mock-host tests
        run: ./build/test_runner enc28j60-mock-host

      - name: Radio medium unit tests
        run: ./build/test_runner radio-medium

      - name: Radio bus unit tests
        run: ./build/test_runner radio-bus

      - name: Event queue unit tests
        run: ./build/test_runner event-queue

      - name: UI recorder transcoder unit tests (CBOR -> JSON)
        run: ./build/test_runner cbor-json

      - name: --ui-record end to end (unchanged stdout, the whole run in the file)
        run: tools/check-ui-record.sh

      - name: External mote — Python sniffer receives + decodes 802.15.4
        # Gates the whole RX path for external motes: the peer must actually
        # receive frames from the emulated Sky pair and decode their MAC
        # header.  The validators assert the decoded source addresses, so a
        # peer that dies or a bus that stops delivering fails here rather
        # than passing silently (a mote failure cannot set the exit code —
        # see docs/design/external-nodes-plan.md §12).
        run: ./build/test_runner test configs/test-ext-sniffer-sky.json -q

      - name: External mote — Python jammer breaks a Sky link
        # Gates the TX path, and is a negative test: fail_on trips if any
        # application message gets through.  The validators keep it honest —
        # without them a jammer that never transmits would also "pass".
        # JAM_PERIOD_MS=2 is needed for a blackout; at the 100 ms default the
        # duty cycle is ~1% and all 4 messages arrive.  Passing it in the
        # config needs the config-v2 `external.args` block (M3).
        run: JAM_PERIOD_MS=2 ./build/test_runner test configs/test-ext-jammer-sky.json -q

      - name: Cross-platform interoperation (Sky + CC2538 + nRF52840 on one DAG)
        # Three CPU architectures and three radio models in one csim
        # simulation. The control for the co-simulation work below: if this
        # passes, a cross-simulator failure is not the emulated side.
        run: ./build/test_runner test configs/test-mixed-platform-rpl.yaml -q

      - name: Cross-platform multi-hop (nRF52840 -> CC2538 -> Sky)
        # The nRF52840 reaches the root only through the CC2538, so every
        # unicast it sends needs the CC2538's auto-ACK one turnaround after
        # the frame; an ACK sent too early fails the MAC layer and the run.
        run: ./build/test_runner test configs/test-mixed-platform-line.yaml -q

      - name: Renode co-simulation unit tests
        # Wire codec, the memory-mapped register window, and the protocol +
        # horizon loop driven by a scripted mock master over a socketpair.
        run: ./build/test_runner renode-cosim

      - name: Renode co-simulation — a mock master drives csim's clock
        # End to end over real sockets and a real process, but PROTOCOL ONLY:
        # Renode itself is not a CI dependency, and a mock master speaking its
        # wire format covers the same exchange in half a second.  Gates exact
        # clock coupling (elapsed sim time must equal ticks x limitBuffer /
        # frequency), frames crossing in both directions (an injected frame
        # must raise the emulated Sky nodes' CRC-valid reception count),
        # console lines forwarded as log messages, determinism across
        # identical runs, and a clean exit when the master dies mid-run.
        #
        # Runs coarse quanta (100 ms) on purpose: the protocol exchange is
        # identical at any quantum size, and the cost here is socket round
        # trips, not simulation — 1 ms quanta made this step ~8 minutes
        # instead of ~0.5 s for exactly the same coverage.  The fine-grained
        # timing belongs to a real Renode run (examples/renode/), which is
        # documented and deliberately not gated.
        run: tools/check-renode-cosim.sh

      - name: Version smoke
        run: ./build/test_runner --version

      - name: cngsim (the same simulation as test_runner; examples, new, check; bad input)
        run: |
          ./build/cngsim --version
          tools/check-cngsim.sh

      - name: A reboot whose boot fails; live saves keep types, boards, names and clocks
        run: |
          tools/check-lifecycle.sh
          tools/check-save.sh

      # Gate G3: docs/quick-start.md run as written, against a package laid
      # out as the release tarball is (release.yml's Package step).
      - name: Quick start, as written, from a package
        timeout-minutes: 10
        run: |
          pkg="$RUNNER_TEMP/pkg"
          rm -rf "$pkg"; mkdir -p "$pkg/bin" "$pkg/build"
          cp build/cngsim "$pkg/bin/"
          cp build/test_runner "$pkg/build/"
          tools/install-data.sh "$pkg"
          tools/check-quick-start.sh "$pkg"

      - name: Malformed firmware (MSP430 ELF images)
        # Firmware symbol values index chip memory, so each image points
        # one at or past the end of the address space.  Each boots in its own
        # process and must exit without a signal; the patch cases must also
        # report the symbol they skipped.  A wild write crashes here, but a
        # write straddling the end of memory needs RUNNER set to a sanitizer
        # build to be seen.
        run: tools/check-elf-malformed.sh

      - name: External-node peer that never advances, or sends an infinite time
        # A peer that answers every step with a wake at (or before) where
        # it stands would exchange steps forever, and a 1e400 time cannot be
        # converted to an integer.  Both must fail the node, and the run must
        # still finish.
        run: tools/check-ext-peer.sh

      - name: GDB stub (a stalled client cannot freeze the run)
        # The stub reads on the simulation's thread: a client that stops
        # mid-packet or never acks must be dropped, and a malformed Z0
        # refused.  ~25 s, because four cases wait out the stub's 5 s
        # timeout.
        run: python3 tools/check-gdb-stub.py

      - name: Web UI access (loopback by default, cross-origin and DNS rebinding refused)
        # The UI accepts commands and WebSocket is exempt from the
        # same-origin policy, so this is what stops any page the operator has
        # open from driving a run.
        run: python3 tools/check-ui-access.py

      - name: Cooja-suite firmware cache names
        # A test never runs firmware built from another directory: names are
        # per source directory + make args, only shipped (tracked) images are
        # reused under the old names, and --clean keeps those.  The suite
        # cannot catch a regression here itself — the wrong firmware often
        # passes.
        run: python3 tools/check-firmware-names.py

      - name: "Plugin system (build + smoke: service, medium, energy, UI)"
        run: |
          make plugins
          tools/check-plugin.sh

      - name: cc2538dk RPL-UDP convergence (with -d 100)
        # Pins the -d (per-node startup-delay spread) mechanism end-to-end:
        # the cc2538dk RPL-UDP pair must converge with the staggered start.
        run: ./build/test_runner arm-multinode firmware/cc2538dk/udp-server.cc2538dk firmware/cc2538dk/udp-client.cc2538dk -t 30000 -d 100 -q

      - name: cc2538dk TSCH with LPM (RCOSC clock-downshift regression, 60s sim)
        # Fix-sensitive guard for the cc2538 SYS_CTRL clock bugs: this firmware
        # actually enters PM1/2, so it exercises the CLOCK_CTRL.OSC switch path
        # (unlike test-tsch-cc2538dk.json, whose firmware never lowers the
        # oscillator). On unfixed main the leaf wedges / desyncs and never joins;
        # with the cc2538_sys_ctrl fix it prints "[LEAF] reachable" (~33s sim).
        run: ./build/test_runner test configs/test-tsch-lpm-cc2538dk.json

      - name: Zoul Firefly multinode (CC1200 nullnet, 20s sim)
        # The Firefly nullnet firmware sends a broadcast every 8 s, so
        # 20 s of sim is enough to verify the CC1200 RX path: each
        # node should print at least one "Received" line.
        run: ./build/test_runner zoul-firefly-multinode firmware/zoul-firefly/nullnet-broadcast-subghz.zoul-firefly -t 20000 -q

      - name: Zoul Firefly sub-GHz 4-node RPL chain (240s sim, ~2s)
        # Three hops of CC1200 unicast with soft ACKs: fails if a sub-GHz
        # ACK's sync word reaches the sender before its radio is back in RX
        # (the per-frame byte clock, F17 in kernel-radio-review-and-
        # performance-plan.md).  Nullnet above is broadcast-only and cannot
        # see that.
        run: ./build/test_runner test configs/chain-4node-firefly-subghz.json -q

      - name: nRF52840-DK Contiki RPL-UDP (40s sim)
        # The runner exits 0 regardless, so assert on the firmware's own
        # reception count (no -q — that suppresses the firmware console).
        run: |
          ./build/test_runner nrf52840-dk-multinode \
            firmware/nrf52840-dk/udp-server.nrf52840-dk \
            firmware/nrf52840-dk/udp-client.nrf52840-dk -t 40000 > out.txt 2>&1
          n=$(grep -ciE 'Received (request|response)' out.txt || true)
          echo "RPL-UDP receptions: $n"; [ "$n" -ge 2 ]

      - name: nRF52840-Dongle Contiki RPL-UDP (40s sim)
        run: |
          ./build/test_runner nrf52840-dongle-multinode \
            firmware/nrf52840-dongle/udp-server.nrf52840-dongle \
            firmware/nrf52840-dongle/udp-client.nrf52840-dongle -t 40000 > out.txt 2>&1
          n=$(grep -ciE 'Received (request|response)' out.txt || true)
          echo "RPL-UDP receptions: $n"; [ "$n" -ge 2 ]

      - name: nRF54L15-DK Contiki RPL-UDP (hardware-only ACK path, 60s sim)
        run: |
          ./build/test_runner test configs/test-2node-nrf54l15-dk.json > nrf54.txt 2>&1
          tail -5 nrf54.txt
          grep -aq "TEST PASSED" nrf54.txt

      - name: XIAO nRF54L15 Contiki RPL-UDP (the bundled images, 60s sim)
        run: |
          ./build/test_runner test configs/test-2node-nrf54l15-xiao.json > xiao.txt 2>&1
          tail -5 xiao.txt
          grep -aq "TEST PASSED" xiao.txt

      - name: nRF52840-DK Zephyr 802.15.4 echo (stock echo_server/client, 40s sim)
        # Experimental Zephyr path; the echo build has no log backend, so assert
        # on the server's own "Received and replied" line.
        run: |
          ./build/test_runner nrf52840-dk-multinode \
            firmware/nrf52840-dk/zephyr-echo-server.nrf52840-dk \
            firmware/nrf52840-dk/zephyr-echo-client.nrf52840-dk -t 40000 > out.txt 2>&1
          n=$(grep -c 'Received and replied' out.txt || true)
          echo "echo replies: $n"; [ "$n" -ge 5 ]

      - name: nRF54L15-DK SPI flash over the Contiki-NG SPI HAL (15 s sim)
        # examples/platform-specific/nrf/spi-flash on the DK's on-board
        # MX25R6435F: JEDEC ID, SFDP, a 256-byte staged read, and seven
        # SPIM re-inits across 1..32 MHz.  Also the regression for the
        # LDREXB/STREXB decode fix — mutex_try_lock, hence every
        # spi_acquire(), depends on it.
        run: ./build/test_runner test configs/test-spi-flash-nrf54l15-dk.json

      - name: nRF54L15-DK ENC28J60 probe over the Contiki-NG SPI HAL (15 s sim)
        # examples/platform-specific/nrf/enc28j60-test on SPIM22: soft
        # reset, CLKRDY, EREVID, a scratch round-trip and a six-register
        # MAC round-trip that needs the MAC/MII dummy read byte.
        run: ./build/test_runner test configs/test-enc28j60-nrf54l15-dk.json

      - name: CC1352R1 LaunchPad boot, null radio (25 s sim)
        # TI CC13x2 SoC: reset handler and SetupTrimDevice() through the
        # stand-in ROM (driverlib behind the ROM API tables), TI's Power,
        # PIN and UART drivers, Contiki's clock on the AON RTC. Also the
        # regression for the bit-band word-address fix: the RTC and channel
        # enables are bit-band writes.
        run: ./build/test_runner test configs/test-boot-cc1352r1-launchpad.yaml

      - name: Determinism guard (CC1352R1 boot run twice → byte-identical)
        run: tools/check-determinism.sh test configs/test-boot-cc1352r1-launchpad.yaml

      - name: CC1352R1 LaunchPad nullnet broadcast, RF core prop mode (30 s sim)
        # The command-level RF core model: power-up/BOOT_DONE, the doorbell,
        # radio-operation chaining, CMD_PROP_TX_ADV/RX_ADV with TI's RX
        # data-entry queue, and the TI prop-mode 802.15.4g framing on the bus.
        run: ./build/test_runner test configs/test-nullnet-cc1352r1-launchpad.yaml

      - name: CC1352R1 LaunchPad RPL-UDP, prop mode (60 s sim)
        run: ./build/test_runner test configs/test-rpl-udp-cc1352r1-launchpad.yaml

      - name: Determinism guard (CC1352R1 RPL-UDP run twice → byte-identical)
        run: tools/check-determinism.sh test configs/test-rpl-udp-cc1352r1-launchpad.yaml

      - name: CC1352R1 LaunchPad Zephyr 802.15.4 echo (stock echo_server/client, 40 s sim)
        # Zephyr's CC13xx driver: the TRNG (entropy at boot), CMD_IEEE_CSMA
        # (every send) and pointer RX entries.  Counts the server's replies;
        # csim's [PKT] lines can split one, hence the low threshold.
        run: |
          ./build/test_runner mixed-multinode \
            firmware/cc1352r1-launchpad/zephyr-echo-server.cc1352r1-launchpad \
            firmware/cc1352r1-launchpad/zephyr-echo-client.cc1352r1-launchpad -t 40000 > out.txt 2>&1
          n=$(grep -c 'Received and replied' out.txt || true)
          echo "echo replies: $n"; [ "$n" -ge 5 ]

      - name: CC1352R1 LaunchPad RIOT hello-world (5 s sim)
        # RIOT idles in WFI with nothing scheduled once main returns; the ARM
        # core used to spin there forever, so this guards with a wall timeout.
        # perl's alarm, not timeout(1): macOS runners have no coreutils, and
        # --wall-timeout is only checked between slices, not inside one.
        run: |
          perl -e 'alarm 60; exec @ARGV' ./build/test_runner mixed-multinode \
            firmware/cc1352r1-launchpad/riot-hello-world.cc1352r1-launchpad -t 5000 > out.txt 2>&1
          grep -q 'This board features a(n) cc26x2_cc13x2 CPU' out.txt
          grep -q 'Simulated time:   5000 ms' out.txt

      - name: CC1352R1 LaunchPad console input and buttons
        # UART0 RX paced at the baud rate (a shell line longer than the
        # 32-byte FIFO), and BTN-1/BTN-2 through the IOC pull-up, edge
        # detect and the AON GPIO edge interrupt (Contiki's button-hal).
        run: |
          ./build/test_runner test configs/test-shell-cc1352r1-launchpad.yaml
          ./build/test_runner test configs/test-button-cc1352r1-launchpad.yaml \
            --script test/scripts/button-cc1352r1-launchpad.cnsh

      - name: CC1352R1 LaunchPad nullnet + RPL-UDP, RF core IEEE mode (2.4 GHz)
        # CMD_IEEE_RX/TX/RX_ACK, frame filtering, hardware auto-ACK, CCA_REQ.
        run: |
          ./build/test_runner test configs/test-nullnet-ieee-cc1352r1-launchpad.yaml
          ./build/test_runner test configs/test-rpl-udp-ieee-cc1352r1-launchpad.yaml

      - name: CC1352R1 (IEEE mode) on one DAG with Sky, CC2538 and nRF52840 (90 s sim)
        run: ./build/test_runner test configs/test-mixed-platform-cc1352r1.yaml

      - name: CC1352R1 TSCH association + held sync, prop and IEEE mode
        # Sub-GHz TSCH (40 ms slots, 4-channel hopping) is also the regression
        # for the 802.15.4g frame tracker's per-frame channel reset, the AON
        # RTC's documented as-soon-as-possible compare, and the watchdog
        # pausing in standby.
        run: |
          ./build/test_runner test configs/test-tsch-cc1352r1-launchpad.yaml
          ./build/test_runner test configs/test-tsch-ieee-cc1352r1-launchpad.yaml
          tools/check-determinism.sh test configs/test-tsch-ieee-cc1352r1-launchpad.yaml

      - name: CC1312R7 LaunchPad boot, console input and buttons
        # The CC13x2x7 part of the CC13x2 model: 704 KB flash / 144 KB SRAM,
        # the CC13x2x7 stand-in ROM, and the FCFG1 identity its driverlib
        # checks (SetupTrimDevice() halts on any other wafer ID).
        run: |
          ./build/test_runner test configs/test-boot-cc1312r7-launchpad.yaml
          tools/check-determinism.sh test configs/test-boot-cc1312r7-launchpad.yaml
          ./build/test_runner test configs/test-shell-cc1312r7-launchpad.yaml
          ./build/test_runner test configs/test-button-cc1312r7-launchpad.yaml \
            --script test/scripts/button-cc1312r7-launchpad.cnsh

      - name: CC1312R7 LaunchPad nullnet, RPL-UDP and TSCH, prop mode
        run: |
          ./build/test_runner test configs/test-nullnet-cc1312r7-launchpad.yaml
          ./build/test_runner test configs/test-rpl-udp-cc1312r7-launchpad.yaml
          tools/check-determinism.sh test configs/test-rpl-udp-cc1312r7-launchpad.yaml
          ./build/test_runner test configs/test-tsch-cc1312r7-launchpad.yaml

      - name: CC1312R7 clients in a CC1352R1-rooted sub-GHz DAG
        run: ./build/test_runner test configs/test-mixed-subghz-cc1312r7-cc1352r1.yaml

      - name: CC1312R7 LaunchPad Zephyr hello-world (out-of-tree cc1312r7_lp board)
        run: |
          perl -e 'alarm 60; exec @ARGV' ./build/test_runner mixed-multinode \
            firmware/cc1312r7-launchpad/zephyr-hello-world.cc1312r7-launchpad -t 2000 > out.txt 2>&1
          grep -q 'Hello World! cc1312r7_lp/cc1352r7' out.txt

      - name: Determinism guard (sky RPL-UDP run twice → byte-identical)
        run: tools/check-determinism.sh multinode firmware/sky/udp-server.sky firmware/sky/udp-client.sky -t 20000

      # The JIT's core contract: CSIM_ARM_JIT=0 and =1 must produce
      # byte-identical simulation output (wall-clock lines excluded), because
      # determinism is a gated guarantee and Lightning is an optional
      # dependency — results must not depend on whether it happens to be
      # installed.
      - name: "JIT cycle-exactness: CSIM_ARM_JIT=0 vs 1 → byte-identical"
        run: |
          filter='Wall-clock|Speed ratio|Throughput|MIPS'
          CSIM_ARM_JIT=0 ./build/test_runner test configs/chain-3node-nrf52840-dk.json | grep -vE "$filter" > jit-off.txt
          ./build/test_runner test configs/chain-3node-nrf52840-dk.json | grep -vE "$filter" > jit-on.txt
          grep -q "TEST PASSED" jit-on.txt
          cmp jit-off.txt jit-on.txt

      # Lockstep verification on real firmware: every compiled block is run,
      # rewound (registers + APSR + cycles + SRAM), re-executed interpreted,
      # and compared exactly.  Complements arm-jit, which is exhaustive over
      # single encodings but never runs multi-instruction blocks — this is
      # the only automated coverage of block composition.
      - name: JIT lockstep verify (cc2538 RPL-UDP, 10 s sim)
        run: |
          CSIM_ARM_JIT_VERIFY=1 ./build/test_runner arm-multinode \
            firmware/cc2538dk/udp-server.cc2538dk firmware/cc2538dk/udp-client.cc2538dk \
            -t 10000 -q > verify.txt 2>&1
          n=$(grep -c "MISMATCH" verify.txt || true)
          echo "lockstep mismatches: $n"
          [ "$n" -eq 0 ]

      # TSCH is the timing-sensitive canary: association + sustained sync
      # depend on per-byte RX delivery landing on exact cycles, so it is the
      # first thing to break if anything shifts an event.  The nRF52840
      # config simulates ~25 s and runs in seconds; the ~240 s cc2538 variant
      # stays out of PR CI on runtime grounds.
      - name: TSCH association + sync (nRF52840-DK)
        run: |
          ./build/test_runner test configs/test-tsch-nrf52840-dk.json > tsch.txt 2>&1
          tail -5 tsch.txt
          grep -aq "TEST PASSED" tsch.txt

      # Contiki-NG against stock Zephyr and RIOT images (the site's interop
      # demos).  RIOT is driven over its UARTE shell, so this is what holds
      # the console-input timing for an idle ARM node and the UARTE's first
      # byte of each line; Zephyr's echo server covers 6LoWPAN fragments
      # both ways.  Both simulate ~20 s in well under a second.
      - name: Interop with Zephyr and RIOT (nRF52840-DK)
        run: |
          ./build/test_runner test configs/interop-contiki-zephyr.json > interop-zephyr.txt 2>&1
          tail -3 interop-zephyr.txt
          grep -aq "TEST PASSED" interop-zephyr.txt
          ./build/test_runner test configs/interop-contiki-riot.json > interop-riot.txt 2>&1
          tail -3 interop-riot.txt
          grep -aq "TEST PASSED" interop-riot.txt

      # The same contract on TSCH, whose drift compensation divides through
      # __aeabi_uldivmod often enough for the JIT to reach it.  The
      # interpreter runs that helper natively (a flat 20 cycles); a block
      # that compiled its Thumb code instead got the same quotient in other
      # cycles, and this run diverged at ~14 s — while chain-3node, which
      # rarely divides, stayed identical.
      - name: JIT cycle-exactness on TSCH (nRF52840-DK, CSIM_ARM_JIT=0 vs 1)
        run: |
          filter='Wall-clock|Speed ratio|Throughput|MIPS'
          CSIM_ARM_JIT=0 ./build/test_runner test configs/test-tsch-nrf52840-dk.json | grep -vE "$filter" > tschjit-off.txt
          ./build/test_runner test configs/test-tsch-nrf52840-dk.json | grep -vE "$filter" > tschjit-on.txt
          grep -q "TEST PASSED" tschjit-on.txt
          cmp tschjit-off.txt tschjit-on.txt

      - name: nRF54L15-DK shell over the UARTE console (console input)
        run: |
          ./build/test_runner test configs/test-shell-nrf54l15-dk.yaml > shell54.txt 2>&1
          tail -5 shell54.txt
          grep -aq "TEST PASSED" shell54.txt
          # The `help` is a timed action at 2000 ms: the shell answers within
          # a millisecond of it, not at the next tick after it (2007 ms).
          grep -aqE "^ +2\.00[01] \[Node 1/ARM\] Available commands" shell54.txt

      - name: TrustZone-M split-image boot (nRF54L15 XIAO)
        run: |
          ./build/test_runner test configs/test-tz-boot-nrf54l15-xiao.yaml > tz.txt 2>&1
          tail -5 tz.txt
          grep -aq "TEST PASSED" tz.txt

      - name: TrustZone-M watchdog reboot (nRF54L15 XIAO)
        run: |
          ./build/test_runner test configs/test-tz-watchdog-nrf54l15-xiao.yaml > tzwd.txt 2>&1
          tail -5 tzwd.txt
          grep -aq "TEST PASSED" tzwd.txt

      - name: TrustZone-M peripheral-permission violation (nRF54L15 XIAO)
        run: |
          ./build/test_runner test configs/test-tz-spu-violation-nrf54l15-xiao.yaml > tzspu.txt 2>&1
          tail -5 tzspu.txt
          grep -aq "TEST PASSED" tzspu.txt

      - name: TrustZone-M two-node RPL-UDP through SG veneers (nRF54L15 XIAO)
        run: |
          ./build/test_runner test configs/test-tz-rpl-udp-nrf54l15-xiao.yaml > tzrpl.txt 2>&1
          tail -5 tzrpl.txt
          grep -aq "TEST PASSED" tzrpl.txt

      - name: TrustZone-M determinism (split image run twice -> byte-identical)
        run: tools/check-determinism.sh test configs/test-tz-boot-nrf54l15-xiao.yaml

      - name: JIT cycle-exactness on nRF54L15 (CSIM_ARM_JIT=0 vs 1)
        run: |
          filter='Wall-clock|Speed ratio|Throughput|MIPS'
          CSIM_ARM_JIT=0 ./build/test_runner test configs/test-tz-boot-nrf54l15-xiao.yaml | grep -vE "$filter" > tzjit-off.txt
          ./build/test_runner test configs/test-tz-boot-nrf54l15-xiao.yaml | grep -vE "$filter" > tzjit-on.txt
          grep -q "TEST PASSED" tzjit-on.txt
          cmp tzjit-off.txt tzjit-on.txt

      - name: Config v1 <-> v2 equivalence (chain-4node-sky)
        run: tools/check-config-equivalence.sh configs/chain-4node-sky.json configs/chain-4node-sky-v2.json

      # YAML is the primary config format; JSON stays accepted.  Three checks:
      # every config in the tree survives load -> YAML -> load with the
      # writer idempotent (a field the writer forgets fails here, not as a
      # quietly different simulation); every invalid fixture — typo'd key,
      # anchor, "Norway" boolean, hex, second document, ... — is refused;
      # and a YAML twin simulates byte-identically to its JSON original.
      - name: Config round-trip (every config, JSON and YAML, through the writer)
        run: ./build/test_runner config-roundtrip configs/*.json configs/*.yaml examples/*.yaml test/configs/yaml-features.yaml
      - name: Config rejection (every invalid fixture must fail to load)
        run: ./build/test_runner config-reject test/configs/invalid/*
      - name: Config nesting cap (YAML and JSON agree at 1000 levels; 200000 refused, not a crash)
        run: ./build/test_runner config-depth
      - name: Config JSON <-> YAML equivalence (chain-4node-sky, JS hello)
        run: |
          tools/check-config-equivalence.sh configs/chain-4node-sky-v2.json configs/chain-4node-sky.yaml
          tools/check-config-equivalence.sh configs/test-js-hello.json configs/test-js-hello.yaml
      # --save-config writes the LIVE setup; the saved file must reproduce
      # the run it was saved from.
      - name: Config save (--save-config reproduces the run)
        run: |
          set -o pipefail   # the run's exit code, not grep's
          ./build/test_runner test configs/test-rpl-udp-sky.yaml --save-config saved.yaml | grep "Saved config"
          tools/check-config-equivalence.sh configs/test-rpl-udp-sky.yaml saved.yaml

      # Lightning is optional by design; now that CI installs it, this is the
      # only coverage the no-Lightning build path has.  Rebuild with the
      # detection overridden, prove the interpreter suites still pass and that
      # arm-jit skips itself cleanly instead of failing.
      - name: Build without Lightning still works (JIT compiled out)
        if: runner.os == 'Linux'
        run: |
          make clean > /dev/null
          make LIGHTNING_CFLAGS= LIGHTNING_LIBS= -j"$(nproc)" > /dev/null
          ./build/test_runner arm-correctness
          ./build/test_runner arm-jit | grep -q "SKIP"
