# The thread overlay as a descriptor: OpenThread's MLE state drawn in OTNS's
# grammar and colours with no C -- the ring is the role, the fill the
# partition (its ID as the colour), a hexagon for routers, a circle for
# children, a dashed ring for a sleepy one, and each node's role commands
# on its right-click menu.  It reads OpenThread's one static instance; the
# layouts at the end are generated from DWARF:
#   tools/gen-struct-layout.py --update examples/overlays/thread.yaml \
#       --name ot-cli-ftd.cc2538dk ~/work/ot-cc2538/build-dbg/bin/ot-cli-ftd
# It draws what the built-in "plugins: [thread]" overlay (C) draws, the
# router-to-router links from the router table (a list) included.
# Reference: docs/design/overlay-descriptors.md

overlay: thread-descriptor
title: "Thread (descriptor)"
symbol: _ZN2ot12gInstanceRawE          # ot::gInstanceRaw
struct: Instance                        # ot::Instance

fields:
  role: mMle.mRole                      # 0 disabled, 1 detached, 2 child, 3 router, 4 leader
  mode: mMle.mDeviceMode.mMode          # bit 3: receiver on when idle (clear: sleepy)
  rloc16: mMle.mRloc16
  partition: mMle.mLeaderData.mPartitionId
  parent: mMle.mParent.mRloc16
  parent_state: mMle.mParent.mState     # 7: the link is valid
  router_count: mMle.mRouterTable.mRouters.mLength

lists:                                  # one per line (the layout generator reads them so)
  routers: { at: mMle.mRouterTable.mRouters.mElements, count: router_count, struct: Router, fields: { router_rloc16: mRloc16, router_state: mState, lq_in: mLinkInfo.mLinkQualityIn, lq_out: mLinkInfo.mLinkQualityOut } }

key: rloc16                             # what a link's field points at

node:
  show: { field: role, gt: 0 }
  glyph: { field: role, map: { 3: hex, 4: hex }, default: circle }
  ring: { field: role, map: { 1: "#546e7a", 2: "#4caf50", 3: "#1565c0", 4: "#c62828" } }
  ring_dash: { all: [ { field: role, eq: 2 }, { field: mode, mask: 8, eq: 0 } ] }
  fill: { field: partition, color: id }
  badge:
    cases:
      - { when: { all: [ { field: role, eq: 2 }, { field: mode, mask: 8, eq: 0 } ] }, value: S }
    field: role
    map: { 2: C, 3: R, 4: L }
  label: "{rloc16:04X}"
  actions:
    cases:                              # a minimal (MTD) child can only leave
      - { when: { all: [ { field: role, eq: 2 }, { field: mode, mask: 2, eq: 0 } ] },
          value: [ ["Detach (thread stop)", "thread stop"] ] }
    field: role
    map:
      1: [ ["Rejoin (thread start)", "thread start"] ]
      2: [ ["Become router (state router)", "state router"],
           ["Become leader (leaderweight 128, state leader)", "leaderweight 128\nstate leader"],
           ["Detach (thread stop)", "thread stop"] ]
      3: [ ["Become leader (leaderweight 128, state leader)", "leaderweight 128\nstate leader"],
           ["Become child (state child)", "state child"], ["Detach (thread stop)", "thread stop"] ]
      4: [ ["Become router (state router)", "state router"], ["Detach (thread stop)", "thread stop"] ]

links:
  - { from: parent, style: parent, color: "#8bc34a",
      when: { all: [ { field: role, eq: 2 }, { field: parent_state, eq: 7 } ] } }

  - { list: routers, to: router_rloc16, once: true, style: router, color: "#1976d2",
      when: { all: [ { field: router_state, eq: 7 }, { any: [ { field: lq_in, gt: 0 }, { field: lq_out, gt: 0 } ] } ] } }

legend:
  - [ring, "role: red leader, blue router, green child (dashed: sleepy)"]
  - [fill, "partition (its ID as the colour)"]
  - [lines, "green: child to parent; blue: router link"]

counts:
  - { label: [leader, leaders], when: { field: role, eq: 4 } }
  - { label: [router, routers], when: { field: role, eq: 3 } }
  - { label: [child, children], when: { field: role, eq: 2 } }
  - { label: detached, when: { field: role, eq: 1 } }

# layouts:begin (tools/gen-struct-layout.py --update): do not edit
layouts:
  - { images: "ot-cli-ftd.cc2538dk", machine: 40, size: 12880, rows: { mMle.mRole: [7361, 1, 0, 0], mMle.mDeviceMode.mMode: [7363, 1, 0, 0], mMle.mRloc16: [7364, 2, 0, 0], mMle.mLeaderData.mPartitionId: [7392, 4, 0, 0], mMle.mParent.mRloc16: [7428, 2, 0, 0], mMle.mParent.mState: [7430, 1, 0, 4], mMle.mRouterTable.mRouters.mLength: [11428, 1, 0, 0], mMle.mRouterTable.mRouters.mElements: [9764, 1664, 0, 0] }, lists: { routers: { size: 52, rows: { mRloc16: [28, 2, 0, 0], mState: [30, 1, 0, 4], mLinkInfo.mLinkQualityIn: [36, 1, 0, 2], mLinkInfo.mLinkQualityOut: [36, 1, 2, 2] } } } }
  - { images: "ot-cli-ftd.nrf52840-dk", machine: 40, size: 33176, rows: { mMle.mRole: [22233, 1, 0, 0], mMle.mDeviceMode.mMode: [22235, 1, 0, 0], mMle.mRloc16: [22236, 2, 0, 0], mMle.mLeaderData.mPartitionId: [22264, 4, 0, 0], mMle.mParent.mRloc16: [22300, 2, 0, 0], mMle.mParent.mState: [22302, 1, 0, 4], mMle.mRouterTable.mRouters.mLength: [31020, 1, 0, 0], mMle.mRouterTable.mRouters.mElements: [29356, 1664, 0, 0] }, lists: { routers: { size: 52, rows: { mRloc16: [28, 2, 0, 0], mState: [30, 1, 0, 4], mLinkInfo.mLinkQualityIn: [36, 1, 0, 2], mLinkInfo.mLinkQualityOut: [36, 1, 2, 2] } } } }
# layouts:end
