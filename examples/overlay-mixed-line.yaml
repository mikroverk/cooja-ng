# Three CPU architectures in a line, with the rpl overlay drawing the DAG:
# a Tmote Sky (MSP430) root, an nRF52840 (Cortex-M4F) in the middle and a
# CC2538 (Cortex-M3) at the far end, each only in range of its
# neighbour, so the CC2538 reaches the root through the nRF52840.
#   cngsim run overlay-mixed-line --ui
# The canvas shows the root as a square, every node's rank, and a green
# arrow to each node's preferred parent: 3 -> 2 -> 1.  Drag node 3 next
# to node 1 and watch its arrow move to the root.
# (The CC2538 is at the end, not in the middle, because a CC2538 parent
# needs its auto-ACK sent a turnaround after the frame, which the
# fix/cc2538-ack-turnaround change (PR #91) adds: without it a Sky or
# nRF52840 child never hears the CC2538's ACKs, loses it as a parent to
# MAC failures, and the overlay shows the child "not joined".
# tools/check-plugin.sh checks this example's DAG.)

version: 2
title: "RPL across three architectures, drawn by the rpl overlay"
timeout_ms: 600000
seed: 42
startup_delay_ms: 1000
plugins: [rpl]

medium:
  type: udgm
  tx_range: 25
  interference_range: 50

mote_types:
  - { name: sky-root,        firmware: ../firmware/sky/udp-server.sky }
  - { name: nrf52840-client, firmware: ../firmware/nrf52840-dk/udp-client.nrf52840-dk }
  - { name: cc2538-client,   firmware: ../firmware/cc2538dk/udp-client.cc2538dk }

nodes:
  - { type: sky-root,        id: 1, name: "Sky (MSP430)",       x:  0, y: 0 }
  - { type: nrf52840-client, id: 2, name: "nRF52840 (M4F)",     x: 20, y: 0 }
  - { type: cc2538-client,   id: 3, name: "CC2538 (M3)",        x: 40, y: 0 }
