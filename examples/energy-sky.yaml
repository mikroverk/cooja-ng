# Energy: the built-in energest plugin records each node's exact time in
# every power state — CPU mode, radio state, LEDs, timers — and puts a
# datasheet power model on top (energy per component, average current,
# battery life).  It prints a table at the end of the run, writes the CSV
# below, and with --ui draws a live panel and streams timeline frames to
# the browser.  docs/energest.md is the guide.
#   cngsim run energy-sky --ui

version: 2
title: "Time in state and energy: two Tmote Skys (energest)"
timeout_ms: 60000
seed: 42

plugins: ["energest"]
energest:
  battery_mah: 2600            # 2 x AA alkaline: print a battery life
  csv: energy-sky.csv          # node x component x state, at the end
  currents:
    sky: { led.on: 4.0 }       # an assumed LED current (no datasheet gives one)

mote_types:
  - { name: server, firmware: ../firmware/sky/udp-server.sky }
  - { name: client, firmware: ../firmware/sky/udp-client.sky }

nodes:
  - { type: server, id: 1, x: 0,  y: 0 }
  - { type: client, id: 2, x: 30, y: 0 }
