# TSCH (time-slotted channel hopping, IEEE 802.15.4e) on two nRF52840 DKs:
# node 1 starts as the coordinator, node 2 scans, associates, and then holds
# time synchronisation (the "drift" lines are its clock corrections).
#   cngsim run tsch-nrf52840 --ui

version: 2
title: "TSCH association and synchronisation on two nRF52840 DKs"
timeout_ms: 90000

mote_types:
  - { name: tsch, firmware: ../firmware/nrf52840-dk/tsch-node.nrf52840-dk }

nodes:
  - { type: tsch, id: 1, x: 0, y: 0 }
  - { type: tsch, id: 2, x: 20, y: 0 }

test:
  steps:
    # timeout_ms bounds each step: no coordinator within 5 s fails the run.
    - { wait: "starting as coordinator", node: 1, timeout_ms: 5000 }
    - { wait: "update time source", node: 2, timeout_ms: 30000 }
    - { wait: "drift", node: 2, count: 3, timeout_ms: 80000 }
