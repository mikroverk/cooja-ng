# OpenThread on the cc2538dk: three nodes running OpenThread's own CLI example
# (firmware/cc2538dk/PROVENANCE.md) form a Thread network.  All take the same
# dataset; node 1 starts first and becomes the leader, nodes 2 and 3 join it
# as children, and node 1's ping to the realm-local all-nodes address is
# answered by both.  The site's OpenThread demo is this run.
version: 2
title: "OpenThread on three CC2538s: a leader, two children, a ping"
timeout_ms: 25000

mote_types:
  - { name: ot-cli-ftd, firmware: firmware/cc2538dk/ot-cli-ftd.cc2538dk }

nodes:
  - { type: ot-cli-ftd, id: 1, x: 0.0, y: 0.0 }
  - { type: ot-cli-ftd, id: 2, x: 30.0, y: 0.0 }
  - { type: ot-cli-ftd, id: 3, x: 15.0, y: 26.0 }

test:
  steps:
    - { wait: "bytes from", node: 1, count: 2, timeout_ms: 25000 }
  # The state replies come in the same millisecond, in any order.
  validators:
    - { pattern: "leader", node: 1, min_count: 1 }
    - { pattern: "child", min_count: 2 }
  actions:
    - { at_ms: 500, type: send_all, data: "dataset networkkey 00112233445566778899aabbccddeeff\n" }
    - { at_ms: 600, type: send_all, data: "dataset channel 15\n" }
    - { at_ms: 700, type: send_all, data: "dataset panid 0x1234\n" }
    - { at_ms: 800, type: send_all, data: "dataset extpanid dead00beef00cafe\n" }
    - { at_ms: 900, type: send_all, data: "dataset networkname cooja-ng\n" }
    - { at_ms: 1000, type: send_all, data: "dataset activetimestamp 1\n" }
    - { at_ms: 1100, type: send_all, data: "dataset commit active\n" }
    - { at_ms: 1200, type: send_all, data: "ifconfig up\n" }
    - { at_ms: 1300, type: send, node: 1, data: "thread start\n" }
    - { at_ms: 12000, type: send, node: 2, data: "thread start\n" }
    - { at_ms: 12000, type: send, node: 3, data: "thread start\n" }
    - { at_ms: 20000, type: send_all, data: "state\n" }
    - { at_ms: 20500, type: send, node: 1, data: "ping ff03::1\n" }
