# The rpl overlay on a five-node Sky chain: the root and four clients 40 m
# apart, each only in range of its neighbours, so every client's preferred
# parent is the node next to it towards the root.  tools/check-overlay.sh
# reads the overlay's last panel (CSIM_DUMP_PANELS) and checks the DODAG.
version: 2
title: "rpl overlay: a five-node Sky chain"
timeout_ms: 120000
seed: 42
startup_delay_ms: 1000
plugins: [rpl]

medium:
  type: udgm
  tx_range: 50
  interference_range: 100

mote_types:
  - { name: server, firmware: firmware/sky/udp-server.sky }
  - { name: client, firmware: firmware/sky/udp-client.sky }

nodes:
  - { type: server, id: 1, x: 0, y: 0 }
  - { type: client, id: 2, count: 4, layout: line, spacing: 40, x: 40, y: 0 }
